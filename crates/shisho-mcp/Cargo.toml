[package]
name = "shisho-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP server for shisho: one tool registry behind a Streamable HTTP transport and stdio, authenticated by the same keys as the REST API"

[dependencies]
shisho-api = { workspace = true }
shisho-auth = { workspace = true }
shisho-config = { workspace = true }
shisho-db = { workspace = true }
shisho-services = { workspace = true }
shisho-codex = { workspace = true }
shisho-cache = { workspace = true }
shisho-ids = { workspace = true }

rmcp.workspace = true
schemars.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
minijinja.workspace = true
rust-embed.workspace = true
sea-orm.workspace = true
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
shisho-api = { workspace = true, features = ["test-util"] }
shisho-oauth = { workspace = true }
sea-orm.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
chrono.workspace = true
wiremock = "0.6"
# Client side of rmcp, used by the transport integration tests.
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
