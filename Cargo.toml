[workspace]
members = [
    "crates/shisho",
    "crates/shisho-api",
    "crates/shisho-auth",
    "crates/shisho-cache",
    "crates/shisho-codex",
    "crates/shisho-config",
    "crates/shisho-crypto",
    "crates/shisho-db",
    "crates/shisho-ids",
    "crates/shisho-mangabaka",
    "crates/shisho-mcp",
    "crates/shisho-oauth",
    "crates/shisho-tsundoku",
    "migration",
]
resolver = "2"
default-members = ["crates/shisho"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["AshDevFr"]
description = "A self-hosted library-aware manga recommendation service, exposed as a single remote MCP server"
# Required by cargo-dist's GitHub CI: it derives artifact/installer URLs from
# the repository field of the distributed package, and `dist plan` fails
# without it. The binary crate inherits it via `repository.workspace = true`.
repository = "https://github.com/AshDevFr/shisho"

[workspace.dependencies]
# Workspace crates (one crate per concern; new domains get their own
# shisho-* crate declared here and consumed with `workspace = true`)
shisho-api = { path = "crates/shisho-api" }
shisho-auth = { path = "crates/shisho-auth" }
shisho-cache = { path = "crates/shisho-cache" }
shisho-codex = { path = "crates/shisho-codex" }
shisho-config = { path = "crates/shisho-config" }
shisho-crypto = { path = "crates/shisho-crypto" }
shisho-db = { path = "crates/shisho-db" }
shisho-ids = { path = "crates/shisho-ids" }
shisho-mangabaka = { path = "crates/shisho-mangabaka" }
shisho-mcp = { path = "crates/shisho-mcp" }
shisho-oauth = { path = "crates/shisho-oauth" }
shisho-tsundoku = { path = "crates/shisho-tsundoku" }
migration = { path = "migration" }

# Runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors and tracing
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Web framework
# Real-time defaults to SSE (axum::response::sse). Add the "ws" feature only if
# you specifically need WebSockets.
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
axum-extra = { version = "0.12", features = ["cookie"] }
http-body-util = "0.1"

# Database
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["runtime-tokio-rustls"] }
# At-rest encryption swaps the bundled SQLite amalgamation for SQLCipher (same
# library + an AES page codec) and vendors OpenSSL so the build is
# self-contained and cross-compiles without a system libcrypto. Feature
# unification means sqlx-sqlite links this same SQLCipher build, so every
# connection can be keyed with `PRAGMA key`. This is at-rest AES only; it does
# not touch the rustls TLS posture (reqwest/sea-orm network stay rustls).
# NOTE: this couples the template to SQLite (SQLCipher); there is no Postgres path.
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
# Encrypted databases are opened by building a sqlx pool whose connect options
# carry the SQLCipher `key` pragma (so it runs before sqlx's default pragmas),
# then wrapping it via `SqlxSqliteConnector`. The version unifies with the sqlx
# sea-orm already links.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# CLI and config
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "yaml", "env"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# MCP server (rmcp 2.x). The legacy HTTP+SSE server was dropped upstream; this
# uses Streamable HTTP for remote clients and stdio for local ones.
rmcp = { version = "2", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
# Tool parameter schemas. rmcp re-exports schemars but the derive needs the
# crate in our dependency graph; keep the major in lockstep with rmcp's.
schemars = "1"
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client
# Since 0.13 the defaults are rustls + charset + http2 + system-proxy (no
# native-tls), so rustls-only no longer needs default-features = false. The
# old "rustls-tls" feature is gone; the explicit feature is now "rustls".
reqwest = { version = "0.13", features = ["json", "stream", "query"] }

# Common types
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"

# Scheduling
tokio-cron-scheduler = "0.15"

# Asset embedding (for the SPA)
rust-embed = "8"
mime_guess = "2"

# Concurrent caches
dashmap = "6"

# Diff rendering (profile version history)
similar = "2"

# MangaBaka offline dump pipeline
flate2 = "1"
tar = "0.4"
sha1 = "0.11"
opentelemetry = "0.32"

# Cryptography (optional, common enough to declare once)
# argon2 stays on 0.5: 0.6 is still a release candidate (the RustCrypto
# password-hash 0.6 generation is not stable yet).
argon2 = "0.5"
# jsonwebtoken 10 requires an explicit crypto provider; rust_crypto is pure
# Rust, matching the project's rustls-everywhere stance.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
# OIDC/OAuth2 login flows (multi-user auth). openidconnect bundles a matching
# oauth2; both use rustls to match the project's rustls-everywhere stance.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
hex = "0.4"
rand = "0.10"
# Constant-time comparison for the static API key and setup token.
subtle = "2"
# Envelope encryption (shisho-crypto): AES-256-GCM AEAD, HKDF key derivation, and
# zeroize to wipe key material on drop.
aes-gcm = "0.11"
hkdf = "0.13"
zeroize = { version = "1", features = ["derive"] }

# The profile `dist build` compiles with; required because dist init never
# runs here (build.yml is hand-maintained) so nothing else defines it.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
# Keep in lockstep with the cargo-dist installer URL in .github/workflows/build.yml
cargo-dist-version = "0.32.0"
ci = "github"
# The release CI lives in the hand-maintained .github/workflows/build.yml, not
# the dist-generated release.yml; without this, `dist plan` fails in CI because
# it wants to own (and regenerate) that workflow file.
allow-dirty = ["ci"]
features = ["embed-frontend"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
install-updater = false
install-path = "CARGO_HOME"
